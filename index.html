<!DOCTYPE html>
<!--
  Zrenjanin and the water crisis — Editorial Map (CIJI / OBCT)
  Cartography: Federico Caruso, caruso@balcanicaucaso.org
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Federico Caruso, caruso@balcanicaucaso.org">
<meta name="cartography" content="Cartography: Federico Caruso, caruso@balcanicaucaso.org">
<title>Zrenjanin and the water crisis — map</title>
<link rel="icon" href="favicon.ico">
<style>
  @font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/Montserrat-Regular.ttf) format('truetype')}
  @font-face{font-family:'Montserrat';font-style:normal;font-weight:500;font-display:swap;src:url(assets/fonts/Montserrat-Medium.ttf) format('truetype')}
  @font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/Montserrat-SemiBold.ttf) format('truetype')}
  @font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/Montserrat-Bold.ttf) format('truetype')}

  :root{
    --paper:#f6f2ea;
    --paper-card:rgba(251,248,242,.96);
    --ink:#141918;
    --ink-soft:#303736;
    --muted:#6e726b;
    --navy:#141918;
    --orange:#f26b21;
    --teal:#2b7583;
    --water-fill:#cfe4e6;
    --water-stroke:#358b9a;
    --rule:rgba(32,39,38,.14);
    --serif:Georgia,Charter,'Bitstream Charter',serif;
    --sans:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--paper);overflow:hidden}
  body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}

  #map-container{
    position:relative;width:100%;height:100%;overflow:hidden;background:var(--paper);
  }
  #map-canvas{
    position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block;
  }
  #map-svg{
    position:absolute;inset:0;width:100%;height:100%;z-index:2;display:block;pointer-events:none;
  }

  /* ------------------------------------------------------------- SVG & Selection styles */
  ::selection{
    background:rgba(43,117,131,.28);color:#141918;
  }
  #map-svg text,
  .label-group,
  .label-group text,
  .lbl-name,
  .lbl-sub,
  .lbl-water,
  .lbl-begej,
  .lbl-tisa{
    font-family:var(--sans);
    user-select:text !important;
    -webkit-user-select:text !important;
    -moz-user-select:text !important;
    pointer-events:auto !important;
    cursor:text !important;
  }

  .lbl-water{
    font-size:10px;font-weight:700;letter-spacing:.16em;
    fill:#2b7583;stroke:var(--paper);stroke-width:3.5px;paint-order:stroke fill;
    text-shadow:0 0 4px var(--paper);
  }
  .lbl-water.lbl-tisa{
    font-size:11px;letter-spacing:.20em;fill:#2b7583;
  }

  .label-group .lbl-name{
    stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;paint-order:stroke fill;
  }
  .label-group .lbl-sub{
    stroke:var(--paper);stroke-width:2.6px;stroke-linejoin:round;paint-order:stroke fill;
  }

  .label-city .lbl-name{
    font-size:11.5px;font-weight:700;letter-spacing:.12em;fill:var(--ink);text-transform:uppercase;
  }
  .label-city .lbl-sub{
    font-size:8px;font-weight:500;letter-spacing:.02em;fill:var(--ink-soft);
  }

  .label-plant .lbl-name{
    font-size:9.5px;font-weight:700;letter-spacing:.08em;fill:#ba4a0e;text-transform:uppercase;
  }
  .label-plant .lbl-sub{
    font-size:7.5px;font-weight:600;letter-spacing:.04em;fill:#a35222;font-style:italic;
  }

  .label-village .lbl-name{
    font-size:8.8px;font-weight:600;letter-spacing:.08em;fill:var(--ink);text-transform:uppercase;
  }

  /* ------------------------------------------------------------- Panel stack */
  .panel-stack{
    position:absolute;left:18px;top:18px;z-index:10;width:312px;
    display:flex;flex-direction:column;gap:12px;
    pointer-events:none;
  }
  .panel{
    width:100%;
    background:var(--paper-card);border:1px solid rgba(32,39,38,.20);
    box-shadow:0 10px 28px rgba(20,25,24,.12);
    padding:16px 18px 14px;pointer-events:auto;
  }
  .eyebrow{
    font-size:8.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);display:flex;align-items:center;gap:8px;
  }
  .eyebrow:before{content:"";width:18px;height:2px;background:var(--orange);display:block}
  .panel h1{
    font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.04;
    letter-spacing:-.035em;margin:10px 0 12px;
  }
  .panel h1 em{font-style:italic;color:var(--teal)}
  .legend{
    padding-top:10px;border-top:1px solid var(--rule);margin-bottom:8px;
  }
  .legend-cols{
    display:flex;justify-content:flex-start;gap:14px;align-items:flex-start;
  }
  html[lang="it"] .legend-cols{gap:10px}
  html[lang="it"] .legend-row{font-size:7.8px;gap:5px}
  .legend-col{
    display:flex;flex-direction:column;gap:6px;
  }
  .legend-row{
    display:flex;align-items:center;gap:7px;font-size:8.3px;font-weight:500;line-height:1.2;
    color:var(--ink-soft);white-space:nowrap;
  }
  .key-dot,.key-line{flex:0 0 auto;display:inline-block}
  .key-dot{width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px #fff,0 1px 3px rgba(20,25,24,.22)}
  .key-dot.plant{background:var(--orange);border-radius:1.5px;transform:rotate(45deg);width:8px;height:8px}
  .key-line{width:16px;height:0;border-top:2.5px solid var(--teal)}
  .source{
    margin-top:7px;padding-top:6px;border-top:1px solid var(--rule);
    font-size:6.8px;line-height:1.4;color:var(--muted);
  }

  /* ------------------------------------------------------------- Logos / Brands */
  .brands{position:absolute;right:18px;top:18px;z-index:10;display:flex;gap:6px;align-items:stretch}
  .brand{
    display:flex;align-items:center;justify-content:center;
    background:var(--paper-card);border:1px solid rgba(32,39,38,.16);
    box-shadow:0 2px 10px rgba(20,25,24,.08);padding:5px 8px;
  }
  .brand img{height:24px;display:block}

  /* ------------------------------------------------------------- Inset Map */
  .inset{
    margin:0;padding:3px;width:100%;
    background:var(--paper-card);border:1px solid rgba(32,39,38,.20);
    box-shadow:0 6px 20px rgba(20,25,24,.10);pointer-events:auto;
  }
  #inset-svg{width:100%;height:auto;aspect-ratio:306/200;display:block;background:#cfe4e6}
  #inset-svg text{font-family:var(--sans);user-select:none;-webkit-user-select:none;pointer-events:none}

  /* ------------------------------------------------------------- Scale Bar */
  .scale{
    position:absolute;right:18px;bottom:32px;z-index:10;display:flex;align-items:center;gap:6px;
    color:var(--ink-soft);font-size:8px;font-weight:600;letter-spacing:.08em;
  }
  .scale-bar{display:block;height:4px;border:1px solid rgba(32,39,38,.6);border-top:0;background:rgba(244,238,226,.45)}

  /* ------------------------------------------------------------- Credits */
  .credits{
    position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:10;
    font-size:6.8px;line-height:1.3;color:#5f665f;text-align:center;
    background:linear-gradient(to top,rgba(244,238,226,.95),rgba(244,238,226,.6),transparent);
    padding:2px 10px 4px;white-space:nowrap;pointer-events:none;
  }
  .credits b{font-weight:600}

  /* ------------------------------------------------------------- Mobile overrides */
  @media (max-width:700px){
    .panel-stack{left:10px;right:10px;top:10px;width:auto}
    .panel{width:100%;padding:10px 12px 8px;z-index:10}
    .panel h1{font-size:20px;margin:5px 0 4px}
    .legend{margin-bottom:6px;padding-top:6px}
    .legend-cols{gap:8px}
    .legend-row{font-size:7.5px;gap:5px}
    .source{display:none}
    .brands{top:auto;right:10px;bottom:26px;gap:4px}
    .brands .brand{padding:3px 5px}
    .brands .brand img{height:16px}
    .inset{
      position:fixed;left:10px;bottom:24px;width:125px;margin:0;z-index:10;
      background:var(--paper-card);box-shadow:0 8px 24px rgba(20,25,24,.15);
    }
    .scale{display:none}
    .credits{font-size:5.5px;padding:1px 4px 2px}
    .label-city .lbl-name{font-size:10px}
    .label-plant .lbl-name{font-size:8px}
    .label-village .lbl-name{font-size:7.5px}
  }
</style>
</head>
<body>
<div id="map-container" data-cartography="Cartography: Federico Caruso, caruso@balcanicaucaso.org">
  <canvas id="map-canvas"></canvas>
  <svg id="map-svg"></svg>

  <div class="panel-stack">
    <header class="panel">
      <div class="eyebrow" data-i18n="eyebrow">CIJI · Serbia</div>
      <h1 data-i18n-html="title">Zrenjanin and the <em>water crisis</em></h1>
      <div class="legend">
        <div class="legend-cols">
          <div class="legend-col">
            <div class="legend-row"><span class="key-dot"></span><span data-i18n="cities">Cities and villages</span></div>
            <div class="legend-row"><span class="key-dot plant"></span><span data-i18n="plant">Metito Treatment Plant</span></div>
          </div>
          <div class="legend-col">
            <div class="legend-row"><span class="key-line"></span><span data-i18n="rivers">Rivers and basins</span></div>
          </div>
        </div>
      </div>
      <p class="source" data-i18n="source">Data: OpenStreetMap contributors, CARTO</p>
    </header>

    <figure class="inset">
      <svg id="inset-svg" viewBox="0 0 306 200"></svg>
    </figure>
  </div>

  <div class="brands">
    <span class="brand"><img src="assets/logos/obct.png" alt="OBCT"></span>
    <span class="brand"><img src="assets/logos/ciji-navy.png" alt="CIJI"></span>
  </div>


  <div class="scale" id="scale">
    <span class="scale-bar" id="scale-bar"></span>
    <span id="scale-label"></span>
  </div>

  <div class="credits" data-i18n-html="credits"><b>Map data</b> © OpenStreetMap contributors · <b>Basemap</b> © CARTO · CIJI / OBCT</div>
</div>

<script>
(function () {
  var lang = new URLSearchParams(window.location.search).get('lang') === 'it' ? 'it' : 'en';
  window.MAP_LANG = lang;
  document.documentElement.lang = lang;
  if (lang !== 'it') return;

  var IT = {
    docTitle: 'Zrenjanin e la crisi idrica — mappa',
    cartography: 'Cartografia: Federico Caruso, caruso@balcanicaucaso.org',
    eyebrow: 'CIJI · Serbia',
    title: 'Zrenjanin e la <em>crisi idrica</em>',
    cities: 'Città e villaggi',
    plant: 'Impianto di trattamento Metito',
    rivers: 'Fiumi e bacini idrici',
    source: 'Dati: contributori OpenStreetMap, CARTO',
    credits: '<b>Dati cartografici</b> © OpenStreetMap contributors · <b>Mappa di base</b> © CARTO · CIJI / OBCT'
  };

  document.title = IT.docTitle;
  var metaCarto = document.querySelector('meta[name="cartography"]');
  if (metaCarto) metaCarto.setAttribute('content', IT.cartography);
  var mapContainer = document.getElementById('map-container');
  if (mapContainer) mapContainer.setAttribute('data-cartography', IT.cartography);
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var k = el.getAttribute('data-i18n');
    if (IT[k]) el.textContent = IT[k];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(function (el) {
    var k = el.getAttribute('data-i18n-html');
    if (IT[k]) el.innerHTML = IT[k];
  });
})();
</script>
<script src="vendor/d3.min.js"></script>
<script src="vendor/d3-tile.min.js"></script>
<script src="source/places.js?v=20261124-2"></script>
<script src="source/geo_layers.js"></script>
<script src="map_d3.js?v=20261124-2"></script>
</body>
</html>
